[project]
name = "telegram-reference-bot"
version = "0.1.0"
description = "A small FAQ and catalog Telegram bot for a small business. Standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dmytro Grechyshchev" }]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
